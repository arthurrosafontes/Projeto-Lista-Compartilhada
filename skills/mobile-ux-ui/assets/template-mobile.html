<!-- Asset de Referência: Card Clean de Item Mobile e Sticky Footer -->
<div class="border border-slate-200 rounded-2xl p-4 mb-3 bg-white flex items-center justify-between gap-3 shadow-sm hover:shadow-md transition-all">
  <!-- Checkbox Grande (Verde) -->
  <label class="flex items-center cursor-pointer min-w-[44px] min-h-[44px] justify-center">
    <input type="checkbox" class="w-6 h-6 accent-green-600 rounded-lg cursor-pointer" />
  </label>

  <!-- Informações do Alimento e Preço Aproximado -->
  <div class="flex-1 min-w-0">
    <div class="flex items-center gap-2 flex-wrap">
      <span class="font-bold text-slate-900 text-base break-words">Arroz Tipo 1 (5kg)</span>
      <span class="text-xs font-semibold text-green-700 bg-green-50 px-2.5 py-1 rounded-full border border-green-200">
        Aproximadamente: R$ 28,90
      </span>
    </div>
  </div>

  <!-- Controles de Quantidade (+ / -) e Excluir -->
  <div class="flex items-center gap-1.5">
    <button type="button" class="min-w-[44px] min-h-[44px] border border-slate-200 bg-slate-50 rounded-xl font-bold text-lg text-slate-800 active:bg-slate-200">-</button>
    <span class="px-2 font-bold text-base text-slate-900">1</span>
    <button type="button" class="min-w-[44px] min-h-[44px] bg-blue-600 text-white rounded-xl font-bold text-lg active:bg-blue-700 shadow-sm">+</button>
    <button type="button" class="min-w-[44px] min-h-[44px] bg-red-50 text-red-600 border border-red-200 rounded-xl font-bold text-sm px-2.5 active:bg-red-100" aria-label="Excluir item">✕</button>
  </div>
</div>

<!-- Sticky Footer Moderno -->
<footer class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/95 backdrop-blur border-t border-slate-200 p-4 shadow-2xl z-30">
  <div class="flex items-center justify-between mb-3">
    <span class="font-bold text-slate-900 text-base">Valor aproximado da lista: R$ 28,90</span>
  </div>
  <button type="button" class="w-full min-h-[50px] bg-green-600 hover:bg-green-700 text-white font-bold text-base rounded-2xl shadow-md transition-all">
    Salvar Lista Atualizada
  </button>
</footer>
